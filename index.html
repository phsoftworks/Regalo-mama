<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mamá ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BLOQUEO -->
  <div id="bloqueo" class="bloqueo">
    <h1>🎁 Desbloquea tu regalo</h1>
    <p>Escribe: el día más feliz de tu vida ❤️</p>

    <input id="clave" type="text" placeholder="Escribe aquí...">
    <button onclick="verificar()">Entrar</button>

    <p id="error"></p>
  </div>

  <!-- CONTENIDO -->
  <div id="contenido" class="oculto">

    <h1 class="titulo">Para mamá ❤️</h1>

    <!-- CARTA -->
    <div class="carta">
      <p id="typed"></p>
    </div>

    <!-- MENSAJES -->
    <div class="mensaje-box">
      <p id="mensaje">Pulsa para ver un mensaje ❤️</p>
      <button onclick="siguienteMensaje()">Siguiente ❤️</button>
    </div>

    <!-- FINAL -->
    <div id="final" class="final oculto">
      <h2>Feliz cumpleaños mamá ❤️</h2>
      <p>Te quiero muchísimo 😘</p>
    </div>

  </div>

  <!-- AUDIO -->
  <audio id="musica" loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <!-- CONFETI -->
  <canvas id="confeti"></canvas>

  <script src="script.js"></script>
</body>
</html>
