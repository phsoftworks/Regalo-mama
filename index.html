<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mamá ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BLOQUEO -->
  <div id="bloqueo" class="bloqueo">
    <h1>🎁 Desbloquea tu regalo</h1>
    <p>Escribe: el día más feliz de tu vida ❤️</p>

    <input id="clave" type="text" placeholder="Escribe aquí...">
    <button onclick="verificar()">Entrar</button>

    <p id="error"></p>
  </div>

  <!-- CONTENIDO -->
  <div id="contenido" class="oculto">

    <h1 class="titulo">Para mamá ❤️</h1>

    <div class="carta">
      <p>
        Te quiero mucho ❤️<br><br>
        Lo siento por enfadarme a veces contigo.<br><br>
        Espero que pases un muy buen día<br><br>
        y que te gusten nuestros regalos 😘
      </p>
    </div>

    <div class="mensaje">Eres la mejor mamá del mundo 🌍</div>
    <div class="mensaje">Gracias por todo 💖</div>
    <div class="mensaje">Siempre contigo ❤️</div>

  </div>

  <!-- MÚSICA -->
  <audio id="musica" loop>
    <source src="lovely-by-alex-productions.mp3" type="audio/mpeg">
  </audio>

  <!-- CONFETI -->
  <canvas id="confeti"></canvas>

  <script src="script.js"></script>
</body>
</html>
